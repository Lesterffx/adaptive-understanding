<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一份文件怎样通过资料处理器</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f7f4; color: #1f2b27; font: 16px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 960px; margin: auto; padding: 32px 20px 44px; }
    h1 { margin: 8px 0 12px; font-size: clamp(26px, 4vw, 36px); line-height: 1.3; }
    .note { padding: 12px 14px; border-left: 4px solid #8d6c2d; background: #fff7df; }
    .stage { margin-top: 24px; padding: 20px; background: #fff; border: 1px solid #d5ddd8; border-radius: 12px; }
    .flow { display: grid; gap: 14px; justify-items: center; }
    .row { width: 100%; display: grid; grid-template-columns: 1fr; gap: 12px; align-items: center; }
    .row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .node { width: 100%; min-height: 64px; display: grid; place-items: center; padding: 10px 12px; text-align: center; border: 2px solid #9aa8a1; border-radius: 10px; background: #f4f7f5; transition: transform .2s ease, border-color .2s ease, background .2s ease, opacity .2s ease; }
    .node small { display: block; color: #5c6b64; font-weight: 400; }
    .node.active { border-color: #176b50; background: #eaf7f1; transform: scale(1.025); }
    .node.warn { border-color: #a45b19; background: #fff0de; }
    .node.fail { border-color: #9d342e; background: #fdeceb; }
    .node.dim { opacity: .34; }
    .connector { height: 24px; width: 2px; background: #a6b1ac; transition: background .2s ease, width .2s ease; }
    .connector.active { background: #176b50; width: 4px; }
    .branch-label { font-size: 13px; color: #617069; }
    .caption { margin-top: 18px; min-height: 82px; padding: 14px 16px; background: #f3f6f4; border-radius: 8px; }
    .caption strong { display: block; margin-bottom: 4px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button { padding: 9px 13px; border: 1px solid #74837c; border-radius: 7px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { border-color: #176b50; outline: 2px solid transparent; }
    .progress { margin-top: 12px; font-size: 14px; color: #5c6b64; }
    .legend { margin-top: 24px; font-size: 14px; color: #5c6b64; }
    @media (max-width: 620px) { .row.two { grid-template-columns: 1fr; } .stage { padding: 14px; } }
  </style>
</head>
<body>
<main>
  <div>Adaptive Understanding · 时间型表达示例</div>
  <h1>一份文件怎样一步一步走？</h1>
  <p class="note"><strong>动画演示，不是运行记录。</strong>流程依据技能包内的自拟教学材料。动画只展示规则与状态变化，不代表真实产品性能。</p>

  <section class="stage" aria-labelledby="stage-title">
    <h2 id="stage-title">资料处理流程</h2>
    <div class="flow" aria-live="polite">
      <div class="row"><div class="node" id="receive">接收文件</div></div>
      <div class="connector" id="c1"></div>
      <div class="row two">
        <div class="node" id="format">格式检查<small>与权限检查同时进行</small></div>
        <div class="node" id="permission">访问权限检查<small>与格式检查同时进行</small></div>
      </div>
      <div class="connector" id="c2"></div>
      <div class="row"><div class="node" id="and">两项都通过？<small>AND 条件</small></div></div>
      <div class="row two">
        <div class="node" id="reject">否：返回失败原因<small>不进入处理队列</small></div>
        <div class="node" id="queue">是：进入处理队列</div>
      </div>
      <div class="connector" id="c3"></div>
      <div class="row"><div class="node" id="generate">解释生成</div></div>
      <div class="connector" id="c4"></div>
      <div class="row two">
        <div class="node" id="missing">来源不足：暂停<small>请求补充材料</small></div>
        <div class="node" id="complete">来源完整：生成完成</div>
      </div>
      <div class="row"><div class="node" id="supplement">补充材料<small>补齐后回到解释生成</small></div></div>
      <div class="connector" id="c5"></div>
      <div class="row"><div class="node" id="review">用户核对<small>生成完成 ≠ 已核对</small></div></div>
    </div>

    <div class="caption" id="caption" aria-live="polite" aria-atomic="true"></div>
    <div class="controls" aria-label="动画控制">
      <button type="button" id="prev">上一步</button>
      <button type="button" id="play">播放</button>
      <button type="button" id="pause">暂停</button>
      <button type="button" id="next">下一步</button>
      <button type="button" id="restart">重新开始</button>
    </div>
    <div class="progress" id="progress"></div>
  </section>

  <p class="legend">注意：示例特意演示一次失败分支和一次“来源不足”回路，目的是看懂规则。它不是同一份真实文件必然经历的完整轨迹。</p>
</main>
<script>
  const ids = ['receive','format','permission','and','reject','queue','generate','missing','complete','supplement','review'];
  const connectors = ['c1','c2','c3','c4','c5'];
  const frames = [
    { title: '1. 文件进入', text: '文件先进入资料处理器。此时还没有完成任何检查。', active: ['receive'], links: ['c1'] },
    { title: '2. 两项检查同时进行', text: '格式检查和访问权限检查同时开始。这里不是先检查格式，再检查权限。', active: ['format','permission'], links: ['c2'] },
    { title: '3. 汇合到 AND 条件', text: '必须两项都通过，才允许继续。通过一项还不够。', active: ['and'] },
    { title: '4. 先看失败分支', text: '任一检查失败，就返回失败原因，而且不会进入处理队列。', active: ['reject'], fail: ['reject'], dim: ['queue','generate','missing','complete','supplement','review'] },
    { title: '5. 再看成功分支', text: '如果两项都通过，文件进入处理队列，然后进入解释生成。检查通过仍不代表解释内容正确。', active: ['queue','generate'], links: ['c3'] },
    { title: '6. 来源不足时暂停', text: '如果生成过程中发现来源不完整，系统暂停这份文件，并请求补充材料。', active: ['generate','missing'], warn: ['missing'], links: ['c4'] },
    { title: '7. 补齐后回到生成', text: '材料补齐后，文件回到解释生成环节。这个回路不能省略。', active: ['supplement','generate'], warn: ['supplement'] },
    { title: '8. 来源完整后生成完成', text: '来源完整时，解释可以生成完成。但“生成完成”仍不等于“内容已核对”。', active: ['complete'], links: ['c5'] },
    { title: '9. 最后由用户核对', text: '用户核对是独立的最后状态。检查通过、生成完成、人工核对是三件不同的事。', active: ['review'] }
  ];

  let index = 0;
  let timer = null;
  const caption = document.getElementById('caption');
  const progress = document.getElementById('progress');

  function clearState() {
    ids.forEach(id => {
      const el = document.getElementById(id);
      el.classList.remove('active','warn','fail','dim');
    });
    connectors.forEach(id => document.getElementById(id).classList.remove('active'));
  }

  function render() {
    clearState();
    const frame = frames[index];
    (frame.active || []).forEach(id => document.getElementById(id).classList.add('active'));
    (frame.warn || []).forEach(id => document.getElementById(id).classList.add('warn'));
    (frame.fail || []).forEach(id => document.getElementById(id).classList.add('fail'));
    (frame.dim || []).forEach(id => document.getElementById(id).classList.add('dim'));
    (frame.links || []).forEach(id => document.getElementById(id).classList.add('active'));
    caption.innerHTML = `<strong>${frame.title}</strong>${frame.text}`;
    progress.textContent = `第 ${index + 1} / ${frames.length} 步`;
  }

  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  function next() { index = Math.min(index + 1, frames.length - 1); render(); if (index === frames.length - 1) stop(); }
  function prev() { stop(); index = Math.max(index - 1, 0); render(); }

  document.getElementById('next').addEventListener('click', () => { stop(); next(); });
  document.getElementById('prev').addEventListener('click', prev);
  document.getElementById('pause').addEventListener('click', stop);
  document.getElementById('restart').addEventListener('click', () => { stop(); index = 0; render(); });
  document.getElementById('play').addEventListener('click', () => {
    stop();
    if (index === frames.length - 1) index = 0;
    render();
    timer = setInterval(next, 2200);
  });

  render();
</script>
</body>
</html>
